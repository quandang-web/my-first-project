<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lịch tháng</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            text-align: center;
            font-family: Arial;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background: orange;
        }

        td {
            height: 60px;
        }

        .empty {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">Lịch Tháng</h2>

    <table>

        <tr>
            <th>CN</th>
            <th>T2</th>
            <th>T3</th>
            <th>T4</th>
            <th>T5</th>
            <th>T6</th>
            <th>T7</th>
        </tr>

        <!-- Tuần 1 -->
        <tr>
            <td class="empty"></td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>

        <!-- Tuần 2 -->
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
            <td>13</td>
        </tr>

        <!-- Tuần 3 -->
        <tr>
            <td>14</td>
            <td>15</td>
            <td>16</td>
            <td>17</td>
            <td>18</td>
            <td>19</td>
            <td>20</td>
        </tr>

        <!-- Tuần 4 -->
        <tr>
            <td>21</td>
            <td>22</td>
            <td>23</td>
            <td>24</td>
            <td>25</td>
            <td>26</td>
            <td>27</td>
        </tr>

        <!-- Tuần 5 -->
        <tr>
            <td>28</td>
            <td>29</td>
            <td>30</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

    </table>

</body>

</html>
