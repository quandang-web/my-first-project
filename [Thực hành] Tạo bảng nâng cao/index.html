<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thời Khóa Biểu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .header {
            background-color: #ffd966;
        }

        .morning {
            background-color: #fff2cc;
        }

        .afternoon {
            background-color: #d9ead3;
        }
    </style>
</head>

<body>

    <h1>THỜI KHÓA BIỂU</h1>

    <table>
        <tr class="header">
            <th rowspan="2">Thứ</th>
            <th colspan="2">Hoạt động</th>
        </tr>

        <tr class="header">
            <th>Sáng</th>
            <th>Chiều</th>
        </tr>

        <tr>
            <td>Thứ 2</td>
            <td class="morning">Toán</td>
            <td class="afternoon">Văn</td>
        </tr>

        <tr>
            <td>Thứ 3</td>
            <td class="morning">Tin học</td>
            <td class="afternoon">Tiếng Anh</td>
        </tr>

        <tr>
            <td>Thứ 4</td>
            <td class="morning">Vật lý</td>
            <td class="afternoon">Hóa học</td>
        </tr>

        <tr>
            <td>Thứ 5</td>
            <td class="morning">Lịch sử</td>
            <td class="afternoon">Địa lý</td>
        </tr>

        <tr>
            <td>Thứ 6</td>
            <td class="morning">Sinh học</td>
            <td class="afternoon">Thể dục</td>
        </tr>
    </table>

</body>

</html>
