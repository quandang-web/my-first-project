<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>DataCorp Financial Report Q1 2026</title>

    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
            text-align: center;
            font-family: Arial;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
        }

        thead {
            background: #f2c94c;
        }

        tfoot {
            background: #d9d9d9;
            font-weight: bold;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <table>

        <caption>Báo cáo Doanh thu Quý 1 năm 2026 - DataCorp</caption>

        <!-- HEADER -->
        <thead>
            <tr>
                <th>Khu vực</th>
                <th>Mảng</th>
                <th>Tháng 1</th>
                <th>Tháng 2</th>
                <th>Tháng 3</th>
            </tr>
        </thead>

        <!-- BODY -->
        <tbody>

            <!-- CHÂU Á - HARDWARE -->
            <tr>
                <td rowspan="4">Châu Á</td>
                <td>Phần cứng</td>
                <td>500$</td>
                <td>600$</td>
                <td>550$</td>
            </tr>

            <!-- CHÂU Á - SOFTWARE -->
            <tr>
                <td>Phần mềm</td>
                <td>1000$</td>
                <td>1200$</td>
                <td>1100$</td>
            </tr>

            <!-- CHÂU ÂU - SOFTWARE -->
            <tr>
                <td rowspan="2">Châu Âu</td>
                <td>Phần mềm</td>
                <td>800$</td>
                <td>900$</td>
                <td>950$</td>
            </tr>

            <!-- (có thể mở rộng thêm nếu cần dữ liệu khác) -->

        </tbody>

        <!-- FOOTER -->
        <tfoot>
            <tr>
                <td colspan="2">Tổng lợi nhuận toàn cầu</td>
                <td>2300$</td>
                <td>2700$</td>
                <td>2600$</td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
