<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách đặc vụ M.I.A</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            text-align: center;
            font-family: Arial;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 10px;
        }

        thead {
            background: #f2c94c;
        }

        tfoot {
            font-weight: bold;
            background: #eee;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Danh sách Đặc vụ M.I.A</h1>

    <table>

        <thead>
            <tr>
                <th>Khu vực</th>
                <th>Mã</th>
                <th>Tên</th>
                <th>Cấp bậc</th>
            </tr>
        </thead>

        <tbody>
            <!-- Châu Á (rowspan = 2) -->
            <tr>
                <td rowspan="2">Châu Á</td>
                <td>007</td>
                <td>James Bond</td>
                <td>Senior</td>
            </tr>
            <tr>
                <td>099</td>
                <td>John Doe</td>
                <td>Trainee</td>
            </tr>

            <!-- Châu Âu (rowspan = 2) -->
            <tr>
                <td rowspan="2">Châu Âu</td>
                <td>006</td>
                <td>Alec Trevelyan</td>
                <td>Senior</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Silva</td>
                <td>Rogue</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Tổng số lượng đặc vụ: 4</td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
